plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ru.zvykmusic.app'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.zvykmusic.app'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            // Google Play upload signing must be configured with your own private keystore.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
