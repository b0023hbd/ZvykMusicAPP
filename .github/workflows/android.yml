name: Build and publish ZvykMusic

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ZvykMusic.apk

      - name: Publish or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: ZvykMusic Latest
          body: 'Автоматическая сборка ZvykMusic. Скачай ZvykMusic.apk из Assets.'
          commit: ${{ github.sha }}
          artifacts: app/build/outputs/apk/debug/ZvykMusic.apk
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
