name: Build and publish ZvykMusic Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk ZvykMusic.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: ZvykMusic Latest
          body: |
            Автоматическая сборка ZvykMusic из последнего коммита ветки main/master.

            Скачайте `ZvykMusic.apk` из раздела Assets ниже.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: ZvykMusic.apk
